[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devguardian"
version = "1.0.0"
description = "Background build monitor and auto-fixer for macOS"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer[all]>=0.9.0",
    "anthropic>=0.25.0",
]

[project.scripts]
devguardian = "cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
